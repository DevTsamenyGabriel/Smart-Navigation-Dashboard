<!Doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Dynamic island style search (glassmorphism) -->
  <div id="search-island" class="collapsed" role="search" aria-label="Search cities">
    <input id="searchInput" placeholder="Search cities, e.g. London" aria-label="Search cities" autocomplete="off" />
    <ul id="searchResults" role="listbox" aria-label="Search results" hidden></ul>
  </div>
  <div id="panel">
    <h3>Directions (Pick on map)</h3>

    <div class="row">
      <b>Mode</b>
      <div class="modes" role="tablist" aria-label="Travel mode">
        <button class="mode-btn active" data-profile="driving" aria-pressed="true" title="Driving">
          <!-- car SVG -->
          <svg class="mode-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 13.5V8.5C3 7.39543 3.89543 6.5 5 6.5H19C20.1046 6.5 21 7.39543 21 8.5V13.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 16.5V15.5C5 14.3954 5.89543 13.5 7 13.5H17C18.1046 13.5 19 14.3954 19 15.5V16.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="7.5" cy="17.5" r="1.5" fill="currentColor"/>
            <circle cx="16.5" cy="17.5" r="1.5" fill="currentColor"/>
          </svg>
          <div class="mode-label">Driving</div>
        </button>

        <button class="mode-btn" data-profile="walking" aria-pressed="false" title="Walking">
          <!-- walking SVG -->
          <svg class="mode-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 5.5C13 6.32843 12.3284 7 11.5 7C10.6716 7 10 6.32843 10 5.5C10 4.67157 10.6716 4 11.5 4C12.3284 4 13 4.67157 13 5.5Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 18L10 13.5L13.5 11L15 12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 11.5L8.5 12.5L9 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="mode-label">Walking</div>
        </button>

        <button class="mode-btn" data-profile="cycling" aria-pressed="false" title="Cycling">
          <!-- bike SVG -->
          <svg class="mode-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6.5" cy="16.5" r="2" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="17.5" cy="16.5" r="2" stroke="currentColor" stroke-width="1.2"/>
            <path d="M8.5 16.5L11 11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M11 11H14L16 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M7 9.5H9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <div class="mode-label">Cycling</div>
        </button>
      </div>
    </div>

    <div class="row">
      <button id="pickOrigin" class="primary ORIGIN">Pick Origin</button>
      <button id="pickDest" class="primary DESTINATION">Pick Destination</button>
      <button id="clear">Clear</button>
    </div>

    <div id="status">
      Click <b>Pick Origin</b> then click on the map.
      Then click <b>Pick Destination</b> and click the destination.
    </div>

    <div id="summary" style="display:none;"></div>
    <div id="routes"></div>
    <div id="instructions"></div>
  </div>

  <div id="map"></div>

  <script src="script.js" defer></script>
</body>
</html>
